<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機序解析完了 | Yuu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .text-medical-blue { color: #0052CC; }
        .bg-medical-blue { background-color: #0052CC; }
        .border-medical-blue { border-color: #0052CC; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900 p-4">
<div class="max-w-md mx-auto">

    <div class="py-12 text-center">
        {% if correct %}
            <div class="text-7xl font-black text-medical-blue mb-2">○</div>
            <p class="text-[10px] font-black uppercase tracking-[0.4em] text-medical-blue">Correct / 正解</p>
        {% else %}
            <div class="text-7xl font-black text-zinc-300 mb-2">×</div>
            <p class="text-[10px] font-black uppercase tracking-[0.4em] text-zinc-400">Incorrect / 不正解</p>
        {% endif %}
    </div>

    <section class="bg-zinc-900 p-8 rounded-sm shadow-xl mb-10">
        <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mb-3">Conceptual Image</p>
        <p class="text-white text-lg font-bold italic leading-relaxed text-center">
            「 {{ q.imagery_hint }} 」
        </p>
    </section>

    <section class="mb-10">
        <h2 class="text-xs font-black text-zinc-400 uppercase tracking-widest mb-4 flex items-center gap-4">
            Mechanism <span class="h-[1px] bg-zinc-200 flex-grow"></span>
        </h2>
        <div class="bg-white p-6 border-l-4 border-medical-blue shadow-sm">
            <p class="text-sm font-bold leading-relaxed text-zinc-700">
                {{ q.core_mechanism }}
            </p>
        </div>
    </section>

    <section class="mb-12">
        <h2 class="text-xs font-black text-zinc-400 uppercase tracking-widest mb-4">Choice Analysis</h2>
        <div class="space-y-3">
            {% for exp in explanations %}
            <div class="text-[12px] p-4 rounded-sm border transition-all
                {% if loop.index0 == correct_index %}
                    bg-blue-50 border-medical-blue text-medical-blue font-bold
                {% else %}
                    bg-white border-zinc-100 text-zinc-500
                {% endif %}">
                <span class="inline-block w-4">{{ loop.index }}.</span> {{ exp }}
            </div>
            {% endfor %}
        </div>
    </section>

    <div class="pb-20">
        <a href="/" class="block w-full bg-zinc-900 text-white text-center py-5 rounded-sm text-[11px] font-black uppercase tracking-[0.2em] hover:bg-medical-blue transition-all">
            Dashboard / 完了
        </a>
    </div>

</div>
</body>
</html>
